<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rhys’s Home / @Rhys</title>
<style>
:root{
  --bg:#06070c;
  --fg:#e8ecf7;
  --muted:#7a8299;
  --accent:#9db8ff;
  --line:rgba(255,255,255,.13);
  --star-rgb:190,215,255;
  --vignette:rgba(0,0,0,.62);
  --panel:rgba(255,255,255,.035);
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

body{
  background:var(--bg);
  color:var(--fg);
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

#field{ position:fixed; inset:0; display:block; z-index:0; }

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background: radial-gradient(ellipse at 50% 45%, transparent 32%, var(--vignette) 100%);
}

/* ============ 加载动画 ============ */
.loader{
  position:fixed;
  inset:0;
  z-index:100;
  background:var(--bg);
  display:grid;
  place-items:center;
  transition: opacity .75s ease, visibility .75s ease;
}
.loader.hidden{ opacity:0; visibility:hidden; }
.loader-inner{ width:190px; text-align:center; }
.loader-bar{
  position:relative;
  height:1px;
  width:100%;
  background:var(--line);
  overflow:hidden;
}
.loader-bar i{
  position:absolute;
  inset:0;
  background:var(--accent);
  transform:scaleX(0);
  transform-origin:left center;
  animation:loadBar 1.55s cubic-bezier(.55,0,.15,1) forwards;
}
@keyframes loadBar{ to{ transform:scaleX(1); } }

.loader-label{
  margin-top:16px;
  font-size:10px;
  letter-spacing:.42em;
  color:var(--muted);
  text-indent:.42em;
  opacity:0;
  animation:labelIn .8s ease .25s forwards;
}
@keyframes labelIn{ to{ opacity:1; } }

/* ============ 导航 ============ */
.nav{
  position:fixed;
  top:30px;
  right:38px;
  z-index:30;
  display:flex;
  align-items:center;
  gap:22px;
  transition:opacity .9s ease .15s;
}
body.loading .nav{ opacity:0; pointer-events:none; }

.nav-item{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:8px 10px;
  border:0;
  background:none;
  color:var(--muted);
  font-family:inherit;
  font-size:12px;
  letter-spacing:.18em;
  cursor:pointer;
  outline:none;
  transition:color .25s ease;
}
.nav-item:hover,
.nav-item.active{ color:var(--fg); }

.nav-item::before,
.clickable-entry::before,
.back-btn::before,
.corner-mark::before{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  opacity:0;
  pointer-events:none;
  border-top:1.5px solid var(--accent);
  border-left:1.5px solid var(--accent);
  left: calc(var(--cl, 0px) - 11px);
  top:  calc(var(--ct, 0px) - 4px);
  transform:translate(5px,5px);
  transition:opacity .26s ease, transform .34s cubic-bezier(.2,.85,.25,1);
}
.nav-item::after,
.clickable-entry::after,
.back-btn::after,
.corner-mark::after{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  opacity:0;
  pointer-events:none;
  border-bottom:1.5px solid var(--accent);
  border-right:1.5px solid var(--accent);
  right: calc(var(--cr, 0px) - 11px);
  bottom: calc(var(--cb, 0px) - 4px);
  transform:translate(-5px,-5px);
  transition:opacity .26s ease, transform .34s cubic-bezier(.2,.85,.25,1);
}

.nav-item:hover::before,
.nav-item:hover::after,
.clickable-entry:hover::before,
.clickable-entry:hover::after,
.back-btn:hover::before,
.back-btn:hover::after,
.corner-mark:hover::before,
.corner-mark:hover::after{
  opacity:1;
  transform:translate(0,0);
}

/* ============ 页面容器 ============ */
main{
  position:fixed;
  inset:0;
  z-index:10;
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:1fr;
  justify-items:center;
  align-items:start;
  overflow-y:auto;
  overflow-x:hidden;
  padding: 0 max(8vw, 42px);
  scroll-behavior:smooth;

  /* 隐藏原生滚动条 */
  scrollbar-width:none;
  -ms-overflow-style:none;
}

main::-webkit-scrollbar{
  display:none;
  width:0;
  height:0;
}

.page{
  grid-area:1 / 1;
  width:min(760px, 100%);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .35s ease, visibility 0s linear .35s;
  min-height:100vh;
  padding:110px 0 90px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  justify-content: safe center;
}
.page.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transition:opacity .35s ease, visibility 0s linear 0s;
}

/* ============ 文本元素 ============ */
.kicker{
  font-size:11px;
  letter-spacing:.3em;
  color:var(--muted);
  margin-bottom:20px;
  text-transform:uppercase;
}
.title{
  margin:0 0 16px;
  font-size:clamp(34px, 7.2vw, 74px);
  font-weight:600;
  letter-spacing:.12em;
  line-height:1.06;
}
.title.small{ font-size:clamp(26px, 4.6vw, 44px); }
.nick{
  font-size:clamp(13px, 1.6vw, 16px);
  letter-spacing:.24em;
  color:var(--accent);
}
.tagline{
  margin:28px 0 0;
  font-size:clamp(12px, 1.5vw, 14px);
  letter-spacing:.08em;
  color:var(--muted);
  white-space:nowrap;
  min-height:1.6em;
}
.rule{
  height:1px;
  width:0;
  background:var(--line);
  margin:22px 0 6px;
  transition:width .9s cubic-bezier(.3,.9,.3,1) .15s;
}
.page.active .rule{ width:100%; }

.list{ list-style:none; margin:16px 0 0; padding:0; }
.list li{
  padding:10px 14px;
  font-size:clamp(12px, 1.5vw, 14px);
  letter-spacing:.06em;
  color:var(--fg);
  white-space:pre;
  border-bottom:1px solid var(--line);
  position:relative;
}
.list li:last-child{ border-bottom:0; }

.clickable-entry{
  cursor:pointer;
  transition: color .25s ease, transform .3s cubic-bezier(.3,.9,.3,1);
}
.clickable-entry:hover{
  color: var(--accent);
  transform: translateX(6px);
}

/* ===== 返回按钮 ===== */
.back-btn{
  position:relative;
  display:inline-block;
  margin-bottom:26px;
  padding:7px 14px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--muted);
  font-family:inherit;
  font-size:10px;
  letter-spacing:.22em;
  cursor:pointer;
  transition:all .25s ease;
  align-self:flex-start;
}
.back-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
}

/* ===== ABOUT 页 ===== */
.about-header{
  display:flex;
  align-items:flex-start;
  gap:26px;
  margin-bottom:22px;
}
.about-avatar{
  flex:0 0 auto;
  width:86px;
  height:86px;
  border:1px solid var(--line);
  background:var(--panel);
  display:grid;
  place-items:center;
  font-size:24px;
  letter-spacing:.1em;
  color:var(--accent);
  position:relative;
  overflow:hidden;
}
.about-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
.about-head-text{ flex:1 1 auto; min-width:0; }
.about-name{
  font-size:clamp(22px, 3.6vw, 34px);
  font-weight:600;
  letter-spacing:.1em;
  margin:0 0 8px;
}
.about-role{
  font-size:clamp(11px, 1.4vw, 13px);
  letter-spacing:.18em;
  color:var(--accent);
}
.about-bio{
  margin-top:20px;
  font-size:clamp(12px, 1.5vw, 14px);
  line-height:1.85;
  color:var(--fg);
  letter-spacing:.04em;
}
.about-bio .type-line{ display:block; min-height:1.4em; white-space:pre-wrap; }
.about-sub{
  margin:26px 0 12px;
  font-size:10px;
  letter-spacing:.28em;
  color:var(--muted);
  text-transform:uppercase;
}
.about-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.about-tag{
  padding:5px 12px;
  border:1px solid var(--line);
  font-size:11px;
  letter-spacing:.14em;
  color:var(--muted);
  transition:all .25s ease;
}
.about-tag:hover{ border-color:var(--accent); color:var(--accent); }

/* ===== 工具 / DROP 面板 ===== */
.tool-panel{ margin-top:24px; font-size:13px; }
.page.active .tool-panel{
  animation: toolIn .55s cubic-bezier(.3,.9,.3,1) .25s both;
}
@keyframes toolIn{
  from{ opacity:0; transform:translateY(8px); }
  to{ opacity:1; transform:translateY(0); }
}
.tool-field{ margin-bottom:16px; }
.tool-field label{
  display:block;
  font-size:10px;
  letter-spacing:.22em;
  color:var(--muted);
  margin-bottom:8px;
  text-transform:uppercase;
}
.tool-field input,
.tool-field textarea{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--fg);
  font-family:inherit;
  font-size:13px;
  padding:11px 13px;
  outline:none;
  transition:border-color .25s ease, background .25s ease;
  resize:vertical;
  letter-spacing:.04em;
}
.tool-field input:focus,
.tool-field textarea:focus{
  border-color:var(--accent);
  background:rgba(157,184,255,.05);
}
.tool-field textarea{ min-height:110px; line-height:1.55; }

.tool-actions{
  display:flex;
  gap:10px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.tool-actions button,
.tool-btn{
  display:inline-block;
  padding:9px 18px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--fg);
  font-family:inherit;
  font-size:11px;
  letter-spacing:.14em;
  cursor:pointer;
  transition:all .25s ease;
  text-decoration:none;
}
.tool-actions button:hover,
.tool-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(157,184,255,.06);
}
.tool-output{
  padding:13px 15px;
  background:var(--panel);
  border:1px solid var(--line);
  font-size:13px;
  min-height:46px;
  word-break:break-all;
  color:var(--fg);
  letter-spacing:.04em;
  line-height:1.6;
  white-space:pre-wrap;
}
.tool-desc{
  padding:13px 15px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
  margin-bottom:16px;
  letter-spacing:.04em;
}
.tool-frame-wrap{
  margin-top:18px;
  border:1px solid var(--line);
  background:#fff;
  height:62vh;
  min-height:380px;
  overflow:hidden;
}
.tool-frame{ width:100%; height:100%; border:0; display:block; background:#fff; }
.tool-empty{
  padding:22px 15px;
  border:1px dashed var(--line);
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
  letter-spacing:.04em;
}
.tool-empty code{
  color:var(--accent);
  font-family:inherit;
  padding:1px 5px;
  border:1px solid var(--line);
  background:var(--panel);
}

/* ===== 自定义滚动条（仅 SHOW 页显示） ===== */
.custom-scrollbar{
  position:fixed;
  top:120px;
  right:16px;
  bottom:80px;
  width:4px;
  z-index:35;
  pointer-events:none;
  opacity:0;
  transition:opacity .35s ease;
}
.custom-scrollbar.show{
  opacity:1;
  pointer-events:auto;
}

.custom-scrollbar-thumb{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:40px;
  background:rgba(255,255,255,.14);
  border-radius:2px;
  cursor:grab;
  transition:background .2s ease, width .2s ease;
  will-change:transform;
}
.custom-scrollbar-thumb:hover,
.custom-scrollbar-thumb.dragging{
  background:var(--accent);
  cursor:grabbing;
}

.custom-scrollbar:hover .custom-scrollbar-thumb{
  width:6px;
}

@media (max-width:680px){
  .custom-scrollbar{
    right:8px;
    top:100px;
    bottom:60px;
    width:3px;
  }
  .custom-scrollbar:hover .custom-scrollbar-thumb{ width:5px; }
}

/* ===== DROP 提示 ===== */
.drop-hint{
  margin-top:20px;
  padding:13px 15px;
  border:1px dashed var(--line);
  color:var(--muted);
  font-size:11px;
  line-height:1.8;
  letter-spacing:.04em;
}
.drop-hint code{
  color:var(--accent);
  font-family:inherit;
  padding:1px 5px;
  border:1px solid var(--line);
  background:var(--panel);
}

/* ===== SHOW 页 ===== */
.show-tabs{
  display:flex;
  gap:10px;
  margin-top:22px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.show-tab{
  padding:8px 18px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  font-family:inherit;
  font-size:11px;
  letter-spacing:.18em;
  cursor:pointer;
  transition:all .25s ease;
}
.show-tab:hover{
  color:var(--fg);
  border-color:var(--accent);
}
.show-tab.active{
  color:var(--accent);
  border-color:var(--accent);
  background:rgba(157,184,255,.05);
}

.masonry{
  column-count:1;
  column-gap:12px;
}
@media (min-width:520px){ .masonry{ column-count:2; } }
@media (min-width:820px){ .masonry{ column-count:3; } }

.masonry-item{
  break-inside:avoid;
  margin-bottom:12px;
  position:relative;
  cursor:zoom-in;
  overflow:hidden;
  border:1px solid var(--line);
  background:var(--panel);
  transition:border-color .25s ease, box-shadow .3s ease;
}
.masonry-item:hover{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent), 0 6px 24px rgba(0,0,0,.35);
}
.masonry-item img{
  display:block;
  width:100%;
  height:auto;
  transition:transform .5s cubic-bezier(.3,.9,.3,1);
}
.masonry-item:hover img{ transform:scale(1.04); }

.record-group{ margin-bottom:38px; }
.record-group:last-child{ margin-bottom:0; }
.record-group-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 4px;
  margin-bottom:16px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  user-select:none;
  font-size:12px;
  letter-spacing:.18em;
  color:var(--accent);
  transition:color .25s ease;
}
.record-group-head:hover{ color:var(--fg); }
.record-group-count{
  color:var(--muted);
  font-size:10px;
  letter-spacing:.12em;
}
.record-group-body{
  display:grid;
  grid-template-rows:1fr;
  transition:grid-template-rows .48s cubic-bezier(.3,.9,.3,1);
}
.record-group.folded .record-group-body{
  grid-template-rows:0fr;
}
.record-group-body > .masonry{
  min-height:0;
  overflow:hidden;
  transition:opacity .35s ease;
}
.record-group.folded .record-group-body > .masonry{
  opacity:0;
}

/* 全屏展示 */
.lightbox{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.94);
  overflow:auto;
  padding:40px;
  opacity:0;
  visibility:hidden;
  transition:opacity .3s ease, visibility .3s ease;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  overscroll-behavior:contain;
}
.lightbox.show{
  opacity:1;
  visibility:visible;
}
.lightbox.dragging{
  cursor:grabbing;
}
.lightbox-inner{
  min-height:100%;
  display:flex;
  align-items:center;      /* 回退 */
  align-items: safe center; /* 空间不够时贴顶，不被裁 */
  justify-content:center;
}
.lightbox img{
  display:block;
  max-width:100%;
  height:auto;
  box-shadow:0 0 100px rgba(255,255,255,.08);
  -webkit-user-drag:none;
  user-drag:none;
  pointer-events:none;      /* 让拖动事件落在容器上 */
}
.lightbox-hint{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  letter-spacing:.24em;
  color:rgba(255,255,255,.4);
  pointer-events:none;
  white-space:nowrap;
}

@media (max-width:680px){
  .lightbox{ padding:16px; }
  .show-tab{ padding:7px 14px; font-size:10px; }
  .lightbox-hint{ font-size:9px; letter-spacing:.16em; }
}

/* ===== DOC 日期分组 ===== */
.doc-group-list{
  list-style:none;
  margin:16px 0 0;
  padding:0;
}

.doc-date-group{
  position:relative;
}

.doc-date-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 4px 10px;
  margin-top:6px;
  border-bottom:1px solid var(--line);
  font-size:11px;
  letter-spacing:.24em;
  color:var(--accent);
  cursor:pointer;
  user-select:none;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:2;
  transition:color .25s ease, background .3s ease;
}
.doc-date-head:hover{ color:var(--fg); }

.doc-date-head-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.doc-date-arrow{
  display:inline-block;
  width:8px;
  height:8px;
  border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translateY(-2px);
  transition:transform .35s cubic-bezier(.3,.9,.3,1);
  flex:0 0 auto;
}
.doc-date-group.folded .doc-date-arrow{
  transform:rotate(-45deg) translateX(-2px);
}

.doc-date-label{
  font-family:inherit;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.doc-date-count{
  color:var(--muted);
  font-size:10px;
  letter-spacing:.12em;
  flex:0 0 auto;
}

/* 折叠动画：用 grid-template-rows 0fr ↔ 1fr 实现高度过渡 */
.doc-date-body-wrap{
  display:grid;
  grid-template-rows:1fr;
  transition:grid-template-rows .48s cubic-bezier(.3,.9,.3,1);
}
.doc-date-group.folded .doc-date-body-wrap{
  grid-template-rows:0fr;
}

.doc-date-body{
  min-height:0;
  overflow:hidden;
  opacity:1;
  transition:opacity .35s ease;
  padding:0;
}
.doc-date-group.folded .doc-date-body{
  opacity:0;
}

.doc-date-body .list{
  margin:0;
  padding:0;
}

.doc-date-body .list li{
  border-bottom:1px solid var(--line);
}
.doc-date-body .list li:last-child{ border-bottom:0; }

/* ===== DOC 内容排版（markdown 渲染） ===== */
.doc-content{
  margin-top:22px;
  font-size:clamp(13px, 1.5vw, 15px);
  line-height:1.85;
  letter-spacing:.03em;
  color:var(--fg);
  animation:docIn .55s ease .15s both;
}
@keyframes docIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}
.doc-content h1,
.doc-content h2,
.doc-content h3,
.doc-content h4,
.doc-content h5,
.doc-content h6{
  margin:26px 0 12px;
  font-weight:600;
  letter-spacing:.08em;
  line-height:1.35;
}
.doc-content h1{ font-size:1.6em; }
.doc-content h2{ font-size:1.35em; }
.doc-content h3{ font-size:1.15em; }
.doc-content h4,
.doc-content h5,
.doc-content h6{ font-size:1em; }
.doc-content h1:first-child,
.doc-content h2:first-child,
.doc-content h3:first-child{ margin-top:0; }
.doc-content p{ margin:0 0 14px; }
.doc-content a{
  color:var(--accent);
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:border-color .2s ease;
}
.doc-content a:hover{ border-bottom-color:var(--accent); }
.doc-content code{
  font-family:inherit;
  font-size:.92em;
  padding:2px 6px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--accent);
}
.doc-content pre{
  margin:0 0 16px;
  padding:14px 16px;
  background:var(--panel);
  border:1px solid var(--line);
  overflow-x:auto;
  font-size:.88em;
  line-height:1.6;
}
.doc-content pre code{
  padding:0;
  background:none;
  border:0;
  color:var(--fg);
}
.doc-content ul,
.doc-content ol{
  margin:0 0 16px;
  padding-left:22px;
}
.doc-content li{ margin-bottom:6px; }
.doc-content blockquote{
  margin:0 0 16px;
  padding:10px 16px;
  border-left:2px solid var(--accent);
  background:var(--panel);
  color:var(--muted);
}
.doc-content hr{
  border:0;
  border-top:1px solid var(--line);
  margin:24px 0;
}
.doc-content img{ max-width:100%; display:block; margin:12px 0; }

.doc-loading,
.doc-error{
  padding:18px;
  border:1px dashed var(--line);
  color:var(--muted);
  font-size:12px;
  letter-spacing:.1em;
  text-align:center;
}
.doc-error{ color:#ff8a8a; }

/* ===== DOC 底部统计条 ===== */
.doc-stats-bar{
  margin-top:26px;
  padding-top:16px;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  font-size:11px;
  letter-spacing:.1em;
  color:var(--muted);
}
.doc-stats-bar .tool-btn{
  padding:6px 12px;
  font-size:10px;
}
.doc-copy-meta{
  margin:-6px 0 6px;
  font-size:10px;
  letter-spacing:.18em;
  color:var(--muted);
  min-height:1.4em;
}
.doc-copy-meta .remote-tag{
  color:var(--accent);
  margin-left:8px;
  padding:1px 6px;
  border:1px solid var(--line);
  font-size:9px;
  letter-spacing:.14em;
}

/* 复制提示 */
.copy-toast{
  position:fixed;
  bottom:32px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  padding:10px 20px;
  background:var(--bg);
  border:1px solid var(--accent);
  color:var(--accent);
  font-size:11px;
  letter-spacing:.18em;
  z-index:60;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease, transform .3s cubic-bezier(.3,.9,.3,1);
}
.copy-toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* 打字机光标 */
.type-line.typing::after{
  content:"";
  display:inline-block;
  width:2px;
  height:1.02em;
  margin-left:.14em;
  background:currentColor;
  vertical-align:-0.16em;
  opacity:.85;
  animation:caret .85s steps(1,end) infinite;
}
@keyframes caret{
  0%,49%{ opacity:.85; }
  50%,100%{ opacity:0; }
}

/* ============ 白块擦除 ============ */
.wipe-wrapper{
  position:fixed;
  overflow:hidden;
  pointer-events:none;
  z-index:45;
  border-radius:1px;
}
.wipe-cover{
  position:absolute;
  inset:0;
  background:#ffffff;
  will-change:transform;
}

/* ============ 响应式 ============ */
@media (max-width:680px){
  .nav{ top:16px; right:12px; gap:10px; }
  .nav-item{ font-size:9.5px; letter-spacing:.08em; padding:6px 5px; }
  main{ padding:0 22px; }

  .about-avatar{ width:70px; height:70px; }
  .doc-date-head{ letter-spacing:.16em; font-size:10px; }
}

<script>
(function () {
  'use strict';

  /* ================= 工具函数 ================= */
  var $  = function (s, c) { return (c || document).querySelector(s); };
  var $$ = function (s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function escapeAttr(s) { return escapeHtml(s); }

  var rootEl = document.documentElement;

  /* =====================================================
   *   远程复制计数配置（GitHub Issues API）
   *
   *   原理：
   *     - 每个文档在仓库里对应一个 issue（在 docs.json 中填 issue 编号）
   *     - 该 issue 的评论数 == 该文档的全局复制次数
   *     - 读取用公开 API，无需 token，但有速率限制（未登录 60 次/小时）
   *     - 写入需要认证，必须经过一个代理（例如 Cloudflare Worker）
   *
   *   启用步骤：
   *     1) 把 enabled 改成 true，填入 owner / repo
   *     2) 为每个文档在仓库里新建一个 issue，把编号填进 docs.json 的 issue 字段
   *     3) （可选）部署一个代理并把地址填进 writeEndpoint，用于写入评论
   *
   *   代理示例（Cloudflare Worker）：
   *     export default {
   *       async fetch(request, env) {
   *         if (request.method !== 'POST') return new Response('no', { status: 405 });
   *         const { issue, docId, chars } = await request.json();
   *         const body = `doc:${docId} | chars:${chars} | ts:${Date.now()}`;
   *         const r = await fetch(
   *           `https://api.github.com/repos/${env.OWNER}/${env.REPO}/issues/${issue}/comments`,
   *           {
   *             method: 'POST',
   *             headers: {
   *               'Authorization': `token ${env.GITHUB_TOKEN}`,
   *               'Accept': 'application/vnd.github+json',
   *               'User-Agent': 'Rhys’sHome-site',
   *               'Content-Type': 'application/json'
   *             },
   *             body: JSON.stringify({ body })
   *           }
   *         );
   *         return new Response(await r.text(), { status: r.status });
   *       }
   *     }
   * ===================================================== */
  var REMOTE_CONFIG = {
    enabled: false,          // 打开即启用远程计数
    owner: 'Rhys',
    repo: 'personal-site',
    writeEndpoint: ''        // 可选：代理地址；留空则只读不写
  };
    
  /* 仓库信息：用于 TOOL 页 folder 类型工具的整包下载 */
  var GITHUB_REPO = {
    owner: 'LDCRsddh',
    repo: 'LDCRsddh.github.io',
    branch: 'main'
  };

  var remoteCounts = {};     // docId -> 云端计数
  var remoteLoaded = false;
  var remoteFailed = false;

  /* 拉取单个文档的云端计数（= issue 评论数） */
  function fetchRemoteCount(issueNumber) {
    if (!REMOTE_CONFIG.enabled || !issueNumber) return Promise.resolve(null);
    var url = 'https://api.github.com/repos/'
            + REMOTE_CONFIG.owner + '/' + REMOTE_CONFIG.repo
            + '/issues/' + issueNumber;
    return fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return null;
        /* issue 对象上的 comments 字段就是评论数 */
        return typeof data.comments === 'number' ? data.comments : 0;
      })
      .catch(function () { return null; });
  }

  /* 并行拉取所有文档的云端计数 */
  function loadRemoteCounts() {
    if (!REMOTE_CONFIG.enabled) return Promise.resolve();
    var targets = docsList.filter(function (d) { return d.issue; });
    if (!targets.length) return Promise.resolve();

    return Promise.all(targets.map(function (d) {
      return fetchRemoteCount(d.issue).then(function (n) {
        if (n !== null) remoteCounts[d.id] = n;
      });
    })).then(function () {
      remoteLoaded = true;
      remoteFailed = false;
      updateDocStatsLabel();
      if (currentName === 'doc') renderDocList();
      if (currentName === 'doc-detail' && currentDocId) updateDocCopyMeta(currentDocId);
    }).catch(function () {
      remoteFailed = true;
      updateDocStatsLabel();
    });
  }

  /* =====================================================
   *   本地复制记录（localStorage）
   * ===================================================== */
  var COPY_KEY = 'rhys-home-doc-copy-stats';

  function getLocalStats() {
    try {
      var raw = localStorage.getItem(COPY_KEY);
      if (!raw) return {};
      var o = JSON.parse(raw);
      return (o && typeof o === 'object') ? o : {};
    } catch (e) { return {}; }
  }

  function saveLocalStats(stats) {
    try { localStorage.setItem(COPY_KEY, JSON.stringify(stats)); } catch (e) {}
  }

  function getLocalCount(docId) {
    var stats = getLocalStats();
    return stats[docId] && stats[docId].count ? stats[docId].count : 0;
  }

  function getLocalChars(docId) {
    var stats = getLocalStats();
    return stats[docId] && stats[docId].chars ? stats[docId].chars : 0;
  }

  function recordLocalCopy(docId, charCount) {
    var stats = getLocalStats();
    if (!stats[docId]) stats[docId] = { count: 0, chars: 0, last: 0 };
    stats[docId].count += 1;
    stats[docId].chars += charCount;
    stats[docId].last = Date.now();
    saveLocalStats(stats);
  }

  /* 有效计数：优先云端，否则本地 */
  function getEffectiveCount(docId) {
    if (REMOTE_CONFIG.enabled && remoteCounts[docId] !== undefined) {
      return remoteCounts[docId];
    }
    return getLocalCount(docId);
  }

  /* 记录一次复制 */
  function recordCopy(docId, charCount) {
    if (!docId || charCount <= 0) return;

    /* 1. 本地一定记录 */
    recordLocalCopy(docId, charCount);

    /* 2. 云端：乐观 +1，异步写 */
    if (REMOTE_CONFIG.enabled) {
      if (remoteCounts[docId] !== undefined) remoteCounts[docId] += 1;
      else remoteCounts[docId] = 1;

      if (REMOTE_CONFIG.writeEndpoint) {
        var doc = findDoc(docId);
        fetch(REMOTE_CONFIG.writeEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            docId: docId,
            chars: charCount,
            issue: doc && doc.issue ? doc.issue : null
          })
        }).catch(function () {
          /* 写失败：回滚乐观计数，避免持续高估 */
          if (remoteCounts[docId] > 0) remoteCounts[docId] -= 1;
          updateDocCopyMeta(docId);
        });
      }
    }

    /* 3. 立刻刷新当前界面的数字 */
    if (currentName === 'doc' && currentPage) {
      var li = currentPage.querySelector('[data-doc="' + docId + '"]');
      if (li) refreshDocListItem(li, findDoc(docId));
    }
    updateDocCopyMeta(docId);
    showCopyToast('已记录复制 · ' + charCount + ' 字符');
  }

  /* 导出本地记录 */
  function exportCopyStats() {
    var stats = getLocalStats();
    var payload = {
      exportedAt: new Date().toISOString(),
      site: 'Rhys’s Home',
      owner: REMOTE_CONFIG.owner || 'Rhys',
      remote: { enabled: REMOTE_CONFIG.enabled, counts: remoteCounts },
      local: stats
    };
    var json = JSON.stringify(payload, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'doc-copy-stats-' + Date.now() + '.json';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
  }

  var toastEl = $('#copy-toast');
  var toastTimer = null;
  function showCopyToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg || '已记录复制';
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 1500);
  }

  var currentDocId = null;

  /* 全局复制监听 */
  document.addEventListener('copy', function () {
    if (!currentDocId) return;
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;

    var container = $('#doc-content');
    if (!container) return;

    var range = sel.getRangeAt(0);
    if (!container.contains(range.commonAncestorContainer)) return;

    var text = sel.toString();
    if (!text || text.length < 2) return;
    recordCopy(currentDocId, text.length);
  });

  /* ================= 星光画布 ================= */
  var canvas = $('#field');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var stars = [];

  function readStarColor() {
    return getComputedStyle(rootEl).getPropertyValue('--star-rgb').trim() || '190,215,255';
  }
  var starColor = readStarColor();

  function resizeCanvas() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();

  var ORBIT_MIN = 54, ORBIT_MAX = 148;
  var R_MIN = 0.45, R_MAX = 1.95;
  var MASS_MIN = R_MIN * R_MIN, MASS_MAX = R_MAX * R_MAX;

  function makeStar() {
    var r = Math.random() * (R_MAX - R_MIN) + R_MIN;
    var mass = r * r;
    var t = clamp((mass - MASS_MIN) / (MASS_MAX - MASS_MIN), 0, 1);
    var orbitR = ORBIT_MIN + t * (ORBIT_MAX - ORBIT_MIN);
    return {
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
      r: r, mass: mass, orbitR: orbitR,
      a: Math.random() * 0.5 + 0.25,
      ph: Math.random() * Math.PI * 2,
      sp: 0.0007 + Math.random() * 0.0016,
      drift: Math.random() * Math.PI * 2,
      dir: Math.random() < 0.5 ? -1 : 1
    };
  }

  function buildStars() {
    var count = Math.round(Math.min(260, Math.max(80, (W * H) / 9000)));
    stars.length = 0;
    for (var i = 0; i < count; i++) stars.push(makeStar());
  }
  buildStars();

  var mouse = { x: -9999, y: -9999, active: false };
  window.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener('mouseout', function (e) {
    if (!e.relatedTarget && !e.toElement) {
      mouse.active = false; mouse.x = -9999; mouse.y = -9999;
    }
  });
  window.addEventListener('touchmove', function (e) {
    var t = e.touches[0];
    if (t) { mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true; }
  }, { passive: true });
  window.addEventListener('touchend', function () {
    mouse.active = false; mouse.x = -9999; mouse.y = -9999;
  });

  var ATTRACT_R  = ORBIT_MAX + 110;
  var ATTRACT_R2 = ATTRACT_R * ATTRACT_R;
  var MAX_SPEED  = 4;

  function tick(now) {
    ctx.clearRect(0, 0, W, H);
    var active = mouse.active;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.drift += (Math.random() - 0.5) * 0.03;
      s.vx += Math.cos(s.drift) * 0.0042;
      s.vy += Math.sin(s.drift) * 0.0042;

      if (active) {
        var dx = s.x - mouse.x, dy = s.y - mouse.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < ATTRACT_R2) {
          var d = Math.sqrt(d2);
          if (d < 1) { d = 1; dx = 1; dy = 0; }
          var nx = dx / d, ny = dy / d;
          var tx = -ny * s.dir, ty = nx * s.dir;
          var t = 1 - d / ATTRACT_R;
          var ease = t * t * (3 - 2 * t);
          var targetVt = clamp(d * 0.017, 0, 2.2) * s.dir;
          var targetVr = clamp((s.orbitR - d) * 0.05, -2.4, 2.4);
          var desiredVx = tx * targetVt + nx * targetVr;
          var desiredVy = ty * targetVt + ny * targetVr;
          var k = 0.075 * ease;
          s.vx += (desiredVx - s.vx) * k;
          s.vy += (desiredVy - s.vy) * k;
        }
      }

      s.vx *= 0.982; s.vy *= 0.982;
      var sp2 = s.vx * s.vx + s.vy * s.vy;
      if (sp2 > MAX_SPEED * MAX_SPEED) {
        var sp = Math.sqrt(sp2);
        s.vx = s.vx / sp * MAX_SPEED;
        s.vy = s.vy / sp * MAX_SPEED;
      }
      s.x += s.vx; s.y += s.vy;
      if (s.x < -30) s.x = W + 30;
      if (s.x > W + 30) s.x = -30;
      if (s.y < -30) s.y = H + 30;
      if (s.y > H + 30) s.y = -30;

      var tw = 0.62 + 0.38 * Math.sin(now * s.sp + s.ph);
      var alpha = s.a * tw;
      if (s.r > 1.25) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + starColor + ',' + (alpha * 0.055) + ')';
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + starColor + ',' + alpha + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  function updateCornerMarks(el) {
    if (!el) return;
    var probe = el.getBoundingClientRect();
    if (probe.bottom < 0 || probe.top > window.innerHeight) return;
    var rects;
    try {
      var range = document.createRange();
      range.selectNodeContents(el);
      rects = range.getClientRects();
    } catch (e) { rects = null; }
    if (!rects || rects.length === 0) return;

    var minL = Infinity, minT = Infinity, maxR = -Infinity, maxB = -Infinity;
    var found = false;
    for (var i = 0; i < rects.length; i++) {
      var rc = rects[i];
      if (!rc || (rc.width === 0 && rc.height === 0)) continue;
      found = true;
      if (rc.left   < minL) minL = rc.left;
      if (rc.top    < minT) minT = rc.top;
      if (rc.right  > maxR) maxR = rc.right;
      if (rc.bottom > maxB) maxB = rc.bottom;
    }
    if (!found) return;

    var elRect = el.getBoundingClientRect();
    var cs = getComputedStyle(el);
    var bL = parseFloat(cs.borderLeftWidth)   || 0;
    var bR = parseFloat(cs.borderRightWidth)  || 0;
    var bT = parseFloat(cs.borderTopWidth)    || 0;
    var bB = parseFloat(cs.borderBottomWidth) || 0;

    var padBoxW = elRect.width  - bL - bR;
    var padBoxH = elRect.height - bT - bB;

    el.style.setProperty('--cl', (minL - elRect.left - bL).toFixed(1) + 'px');
    el.style.setProperty('--ct', (minT - elRect.top  - bT).toFixed(1) + 'px');
    el.style.setProperty('--cr', (padBoxW - (maxR - elRect.left - bL)).toFixed(1) + 'px');
    el.style.setProperty('--cb', (padBoxH - (maxB - elRect.top  - bT)).toFixed(1) + 'px');
  }

  function typeIn(el) {
    var text = el.dataset.text || '';

    el.textContent = '';
    return new Promise(function (resolve) {
      var i = 0;
      (function step() {
        if (i >= text.length) {
          el.classList.remove('typing');
          resolve();
          return;
        }
        var ch = text.charAt(i);
        el.textContent += ch;
        i++;
        var delay = base + Math.random() * base * 0.5;
        if (ch === ' ') delay = base * 0.55;
        setTimeout(step, delay);
      })();
    });
  }

      var i = text.length;
      (function step() {
        if (i <= 0) {
          el.classList.remove('typing');
          resolve();
          return;
        }
        i--;
        el.textContent = text.slice(0, i);
        setTimeout(step, base + Math.random() * base * 0.5);

  function measureTextBounds(el) {
    var range, rects;
    try {
      range = document.createRange();
      range.selectNodeContents(el);
      rects = range.getClientRects();
    } catch (e) { rects = null; }

    if (!rects || rects.length === 0) {
      var r = el.getBoundingClientRect();
      return { left: r.left, top: r.top, width: r.width, height: r.height };
    }
    var left = Infinity, top = Infinity, right = -Infinity, bottom = -Infinity;
    var found = false;
    for (var i = 0; i < rects.length; i++) {
      var rc = rects[i];
      if (!rc || (rc.width === 0 && rc.height === 0)) continue;
      found = true;
      if (rc.left   < left)   left   = rc.left;
      if (rc.top    < top)    top    = rc.top;
      if (rc.right  > right)  right  = rc.right;
      if (rc.bottom > bottom) bottom = rc.bottom;
    }
    if (!found) {
      var r2 = el.getBoundingClientRect();
      return { left: r2.left, top: r2.top, width: r2.width, height: r2.height };
    }
    return { left: left, top: top, width: right - left, height: bottom - top };

        wrapper.style.width  = (b.width  + PAD_X * 2) + 'px';
        wrapper.style.height = (b.height + PAD_Y * 2) + 'px';

  /* =====================================================
   *   Markdown 解析
   * ===================================================== */
  function renderInline(raw) {
    var s = String(raw)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
      return '<a href="' + u.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">' + t + '</a>';
    });
    return s;
  }

  function parseMarkdown(md) {
    var lines = String(md).replace(/\r\n/g, '\n').split('\n');
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      if (/^```/.test(line)) {
        i++;
        var code = [];
        while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        out.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>');
        continue;
      }

      var hMatch = line.match(/^(#{1,6})\s+(.*)$/);
      if (hMatch) {
        var lv = hMatch[1].length;
        out.push('<h' + lv + '>' + renderInline(hMatch[2]) + '</h' + lv + '>');
        i++;
        continue;
      }

      if (/^\s*-{3,}\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      if (/^>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          q.push(lines[i].replace(/^>\s?/, '')); i++;
        }
        out.push('<blockquote>' + renderInline(q.join(' ')) + '</blockquote>');
        continue;
      }

      if (/^\s*[-*+]\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          ul.push(lines[i].replace(/^\s*[-*+]\s+/, '')); i++;
        }
        out.push('<ul>' + ul.map(function (t) { return '<li>' + renderInline(t) + '</li>'; }).join('') + '</ul>');
        continue;
      }

      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          ol.push(lines[i].replace(/^\s*\d+\.\s+/, '')); i++;
        }
        out.push('<ol>' + ol.map(function (t) { return '<li>' + renderInline(t) + '</li>'; }).join('') + '</ol>');
        continue;
      }

      if (line.trim() === '') { i++; continue; }

      var para = [line];
      i++;
      while (i < lines.length &&
             lines[i].trim() !== '' &&
             !/^(#{1,6})\s/.test(lines[i]) &&
             !/^\s*[-*+]\s/.test(lines[i]) &&
             !/^\s*\d+\.\s/.test(lines[i]) &&
             !/^```/.test(lines[i]) &&
             !/^>\s?/.test(lines[i]) &&
             !/^\s*-{3,}\s*$/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push('<p>' + renderInline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

    order.sort(function (a, b) {

  /* ============ 滚动折叠逻辑 ============ */
  var mainEl = document.querySelector('main');

  function updateFoldStates() {
    if (!currentPage || currentPage.dataset.page !== 'doc') return;

    var viewportTop = mainEl.getBoundingClientRect().top;
    /* 头部滚到视口顶部 90px 以内就开始折叠 */
    var foldThreshold = viewportTop + 90;
    /* 头部滚到视口顶部以下 30px 才展开，形成小回差，避免抖动 */
    var unfoldThreshold = viewportTop + 30;

    var groups = currentPage.querySelectorAll('.doc-date-group');
    groups.forEach(function (group) {
      if (group.dataset.manual === '1') return;

      var headEl = group.querySelector('.doc-date-head');
      if (!headEl) return;

      var headTop = headEl.getBoundingClientRect().top;
      var isFolded = group.classList.contains('folded');

      if (!isFolded && headTop < foldThreshold) {
        group.classList.add('folded');
      } else if (isFolded && headTop > unfoldThreshold) {
        group.classList.remove('folded');
      }
    });
  }

  mainEl.addEventListener('scroll', function () {
    if (foldPending) return;
    foldPending = true;
    requestAnimationFrame(function () {
      foldPending = false;
      updateFoldStates();
    });
  }, { passive: true });

  function prepareDocDetail(id) {

    var token = ++docFetchToken;

    fetch(doc.file, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (md) {
        if (token !== docFetchToken) return;
        contentEl.innerHTML = parseMarkdown(md);
        updateDocCopyMeta(doc.id);
      })
      .catch(function (err) {
        if (token !== docFetchToken) return;
        contentEl.innerHTML =
          '<p class="doc-error">加载失败：' +
          escapeHtml(err && err.message ? err.message : '未知错误') +
          '</p>';
      });
  }

  function updateDocCopyMeta(docId) {
    var metaEl = $('#doc-copy-meta');
    if (!metaEl) return;

    var localCount = getLocalCount(docId);
    var localChars = getLocalChars(docId);
    var remoteCount = (REMOTE_CONFIG.enabled && remoteCounts[docId] !== undefined)
      ? remoteCounts[docId] : null;

    var parts = [];
    if (remoteCount !== null) {
      parts.push('复制 ' + remoteCount + ' 次');
    } else if (localCount > 0) {
      parts.push('本地记录复制 ' + localCount + ' 次');
    }
    if (localChars > 0) {
      parts.push('累计 ' + localChars + ' 字符');
    }

    var html = escapeHtml(parts.join(' · '));
    if (remoteCount !== null) {
      html += '<span class="remote-tag">CLOUD</span>';
    }
    metaEl.innerHTML = html;
  }

  /* =====================================================
   *   内置工具逻辑
   * ===================================================== */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function formatDate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
           ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  function handleTimestamp(action) {
    var input  = document.getElementById('ts-input');
    var output = document.getElementById('ts-output');
    if (!input || !output) return;
    var v = input.value.trim();
    if (!v) { output.textContent = '请输入内容'; return; }

    if (action === 'to-date') {
      var n = Number(v);
      if (isNaN(n) || !isFinite(n)) { output.textContent = '不是有效的时间戳'; return; }
      if (Math.abs(n) < 1e12) n *= 1000;
      var d = new Date(n);
      if (isNaN(d.getTime())) { output.textContent = '不是有效的时间戳'; return; }
      output.textContent = formatDate(d) + '\n时间戳（秒）：' + Math.floor(d.getTime() / 1000);
    } else {
      var d2 = new Date(v.replace(/-/g, '/'));
      if (isNaN(d2.getTime())) { output.textContent = '不是有效的日期'; return; }
      output.textContent = '秒级：' + Math.floor(d2.getTime() / 1000) +
                           '\n毫秒：' + d2.getTime();
    }
  }

  function handleBase64(action) {
    var input  = document.getElementById('b64-input');
    var output = document.getElementById('b64-output');
    if (!input || !output) return;
    var v = input.value;
    if (!v) { output.textContent = '请输入内容'; return; }
    try {
      if (action === 'encode') {
        output.textContent = btoa(unescape(encodeURIComponent(v)));
      } else {
        output.textContent = decodeURIComponent(escape(atob(v.trim())));
      }
    } catch (err) {
      output.textContent = '转换失败：' + (err && err.message ? err.message : '格式有误');
    }
  }

  function updateCount() {

    var v = input.value;
    var chars = v.length;
    var lines = v ? v.split('\n').length : 0;
    var words = v.trim() ? v.trim().split(/\s+/).length : 0;
    output.textContent = '字符 ' + chars + '　词 ' + words + '　行 ' + lines;
  }

    /* =====================================================
   *   自定义滚动条（仅 SHOW 页显示）
   * ===================================================== */
  var scrollbarEl = null;
  var scrollbarThumb = null;
  var scrollbarDragging = false;
  var scrollbarStartY = 0;
  var scrollbarStartScrollTop = 0;

  function initCustomScrollbar() {
    scrollbarEl = $('#custom-scrollbar');
    scrollbarThumb = $('#custom-scrollbar-thumb');
    if (!scrollbarEl || !scrollbarThumb) return;

    scrollbarThumb.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      scrollbarDragging = true;
      scrollbarStartY = e.clientY;
      scrollbarStartScrollTop = mainEl.scrollTop;
      scrollbarThumb.classList.add('dragging');
      document.body.style.userSelect = 'none';
      e.preventDefault();
      e.stopPropagation();
    });

    document.addEventListener('mousemove', function (e) {
      if (!scrollbarDragging) return;

      var trackH = scrollbarEl.clientHeight;
      var thumbH = scrollbarThumb.offsetHeight;
      var maxThumbTop = trackH - thumbH;
      if (maxThumbTop <= 0) return;

      var scrollH = mainEl.scrollHeight;
      var clientH = mainEl.clientHeight;
      var maxScroll = scrollH - clientH;
      if (maxScroll <= 0) return;

      var dy = e.clientY - scrollbarStartY;
      var scrollDelta = dy * (maxScroll / maxThumbTop);
      mainEl.scrollTop = scrollbarStartScrollTop + scrollDelta;
    });

    document.addEventListener('mouseup', function () {
      if (!scrollbarDragging) return;
      scrollbarDragging = false;
      scrollbarThumb.classList.remove('dragging');
      document.body.style.userSelect = '';
    });

    /* 点击轨道空白处：跳转到对应位置 */
    scrollbarEl.addEventListener('click', function (e) {
      if (e.target === scrollbarThumb) return;

      var rect = scrollbarEl.getBoundingClientRect();
      var clickRatio = (e.clientY - rect.top) / rect.height;

      var scrollH = mainEl.scrollHeight;
      var clientH = mainEl.clientHeight;
      var maxScroll = scrollH - clientH;
      if (maxScroll <= 0) return;

      mainEl.scrollTop = clickRatio * maxScroll - clientH / 2;
    });

    mainEl.addEventListener('scroll', updateCustomScrollbar, { passive: true });
    window.addEventListener('resize', updateCustomScrollbar);

    /* 内容尺寸变化时也刷新（图片懒加载后高度会变） */
    if (window.ResizeObserver) {
      var target = $('#show-content');
      if (target) {
        var ro = new ResizeObserver(function () { updateCustomScrollbar(); });
        ro.observe(target);
      }
    }

    updateCustomScrollbar();
  }

  function updateCustomScrollbar() {
    if (!scrollbarEl || !scrollbarThumb) return;

    /* 只在 SHOW 页显示 */
    if (currentName !== 'show') {
      scrollbarEl.classList.remove('show');
      return;
    }

    var scrollH = mainEl.scrollHeight;
    var clientH = mainEl.clientHeight;

    /* 内容不足一屏，不需要滚动条 */
    if (scrollH <= clientH + 2) {
      scrollbarEl.classList.remove('show');
      return;
    }

    scrollbarEl.classList.add('show');

    var trackH = scrollbarEl.clientHeight;
    var thumbH = Math.max(36, Math.round(trackH * (clientH / scrollH)));
    var maxThumbTop = trackH - thumbH;

    var maxScroll = scrollH - clientH;
    var ratio = maxScroll > 0 ? (mainEl.scrollTop / maxScroll) : 0;
    ratio = Math.max(0, Math.min(1, ratio));
    var thumbTop = Math.round(maxThumbTop * ratio);

    scrollbarThumb.style.height = thumbH + 'px';
    scrollbarThumb.style.transform = 'translateY(' + thumbTop + 'px)';
  }

  /* ===== 拖动平移 ===== */
  var lightboxEl = $('#lightbox');
  var isDragging = false;
  var hasDragged = false;
  var dragStartX = 0, dragStartY = 0;
  var scrollStartX = 0, scrollStartY = 0;

  if (lightboxEl) {
    lightboxEl.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      isDragging = true;
      hasDragged = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      scrollStartX = lightboxEl.scrollLeft;
      scrollStartY = lightboxEl.scrollTop;
      lightboxEl.classList.add('dragging');
      e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
      if (!isDragging) return;
      var dx = e.clientX - dragStartX;
      var dy = e.clientY - dragStartY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasDragged = true;
      lightboxEl.scrollLeft = scrollStartX - dx;
      lightboxEl.scrollTop  = scrollStartY - dy;
    });

    document.addEventListener('mouseup', function () {
      if (!isDragging) return;
      isDragging = false;
      lightboxEl.classList.remove('dragging');
    });

    lightboxEl.addEventListener('click', function () {
      if (hasDragged) {
        hasDragged = false;
        return;
      }
      closeLightbox();
    });
  }

    'doc': 'doc',
    'doc-detail': 'doc',
    'tool': 'tool',
    'tool-detail': 'tool',
    'drop': 'drop',
    'show': 'show'
  };

  function setNavActive(name) {
    var active = NAV_MAP[name] || name;
    navBtns.forEach(function (b) {
      b.classList.toggle('active', b.dataset.goto === active);
    });
  }

  function goTo(name, param) {
    if (switching) return;

    var next = pageByName(name);
    if (!next) return;
    if (name === currentName && (param || null) === (currentParam || null)) return;

    switching = true;
    taglineToken++;

    var prev = currentPage;
    var mode = pickTransitionMode();

    var outPromise = (mode === 'wipe') ? wipeOutPage(prev) : typeOutPage(prev);

    outPromise.then(function () {
      if (prev) prev.classList.remove('active');
      taglineEl.textContent = '';
      taglineEl.classList.remove('typing');

      if (currentName === 'doc-detail' && name !== 'doc-detail') {
        currentDocId = null;
      }

      currentName = name;
      currentParam = param || null;
      currentPage = next;
      setNavActive(name);

      /* 先清空旧内容 */
      clearPage(next);

      /* 再准备新内容（顺序不能反，否则 loading 会被清掉） */
      if (name === 'doc') renderDocList();
      if (name === 'doc-detail') prepareDocDetail(param);
      if (name === 'tool-detail') prepareToolDetail(param);
      if (name === 'show') renderShow(currentShowTab);

      next.classList.add('active');

      /* 进入任何页面时把 main 滚回顶部 */
      mainEl.scrollTop = 0;

      if (mode === 'wipe') {
        return sleep(90).then(function () { return wipeInPage(next); });
      }
      return sleep(160).then(function () { return typeInPage(next); });
    }).then(function () {
      if (name === 'home') startTagline();
      $$('.clickable-entry, .back-btn, .corner-mark', next).forEach(updateCornerMarks);
      updateCustomScrollbar();
      switching = false;
    });
  }

  navBtns.forEach(function (btn) {
    btn.addEventListener('click', function () { goTo(btn.dataset.goto); });
  });

  /* =====================================================
   *   启动
   * ===================================================== */
  function boot() {
    var loader = $('#loader');

    /* 先加载文档列表，再拉取远程计数（依赖 docs.json 的 issue 字段） */
    loadDocs().then(function (list) {
      docsList = list;
      updateDocStatsLabel();
      /* 文档列表就绪后并行拉远程计数 */
      return loadRemoteCounts();
    }).then(function () {
      if (currentName === 'doc') renderDocList();
    });

    loadTools().then(function (list) {
      toolsList = list;
      renderToolList();
    });
    loadDrops().then(function (list) {
      dropsList = list;
      renderDropList();
    });
        loadShow().then(function (data) {
      showData = data;
      if (currentName === 'show') renderShow(currentShowTab);
    });

    tryLoadAvatar();
    initCustomScrollbar();

    setTimeout(function () {
      loader.classList.add('hidden');
      document.body.classList.remove('loading');

      setTimeout(function () {
        if (loader.parentNode) loader.parentNode.removeChild(loader);
      }, 900);

      var home = pageByName('home');
      currentPage = home;
      currentName = 'home';
      currentParam = null;
      setNavActive('home');
      home.classList.add('active');

      sleep(220).then(function () {
        return typeInPage(home);
      }).then(function () {
        startTagline();
        navBtns.forEach(updateCornerMarks);
      });
    }, 1600);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();
</script>
</body>
</html>
